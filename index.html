            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;

            min-height: 100vh;

        #celebrationCanvas {

            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
        }

        /* Lớp nháy sáng khi ấn Enter nổ ra lời chúc */

            position: fixed;
            inset: 0;
            background: #ffffff;
            pointer-events: none;
            z-index: 999;
            opacity: 0;
        }

        @keyframes screenFlash {
            0% { opacity: 0; }
            25% { opacity: 0.95; }
            100% { opacity: 0; }
        }

        .flash-active {
            animation: screenFlash 0.85s ease-out forwards;
        }

            z-index: 10;
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            flex-direction: column;
            justify-content: space-between;

            align-items: center;
            justify-content: space-between;
            gap: 8px;

            width: 100%;

        }

            position: relative;
            width: 100%;

            border: 1px solid rgba(255, 255, 255, 0.16);

            overflow: hidden;

        .card-top-gradient {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #38bdf8, #ec4899, #f59e0b);
        }

        /* Đầu thẻ Quiz */
        .quiz-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }

        .quiz-badge-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge-python {
            background: rgba(56, 189, 248, 0.18);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #7dd3fc;

            font-weight: 800;
            padding: 4px 10px;

            letter-spacing: 0.5px;

        .question-counter {

            font-weight: 700;

        }

        .gift-star-status {
            font-size: 13px;
            font-weight: 700;
            color: #fbbf24;
        }

        /* Thanh tiến trình */
        .progress-track {
            width: 100%;

            background: #1e293b;
            border-radius: 999px;
            overflow: hidden;
            margin-bottom: 18px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .progress-fill {
            height: 100%;
            width: 33.33%;
            background: linear-gradient(90deg, #38bdf8, #ec4899, #f59e0b);
            border-radius: 999px;
            transition: width 0.4s ease;
        }

        /* Nội dung câu hỏi */
        .question-title {
            font-size: 17px;
            line-height: 1.5;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 12px;
        }

        .code-snippet-box {
            background: #090d16;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 11px 13px;
            font-family: "Courier New", Courier, monospace;
            font-size: 14px;
            line-height: 1.45;
            color: #6ee7b7;
            margin-bottom: 16px;
            white-space: pre-wrap;
            word-break: break-word;

        /* Danh sách 4 đáp án A, B, C, D */

            display: flex;
            flex-direction: column;
            gap: 11px;
        }

        .option-btn {
            width: 100%;
            text-align: left;
            background: rgba(30, 41, 59, 0.85);
            border: 1.5px solid rgba(148, 163, 184, 0.3);
            border-radius: 15px;
            padding: 14px 15px;
            color: #f8fafc;
            font-size: 15px;
            font-weight: 600;
            font-family: "Courier New", Courier, monospace;

            align-items: center;
            justify-content: space-between;

            transition: all 0.2s ease;

        .option-btn:hover:not(:disabled) {

            background: rgba(30, 41, 59, 1);

            transform: scale(0.98);

            background: rgba(16, 185, 129, 0.22) !important;
            border-color: #34d399 !important;
            color: #a7f3d0 !important;

        .option-btn.wrong {
            background: rgba(244, 63, 94, 0.22) !important;
            border-color: #fb7185 !important;
            color: #fecdd3 !important;
        }

        @keyframes blinkCursor {

        }

        function switchTab(tabName) {
            document.getElementById('busyTab').classList.remove('active');
            document.getElementById('freeTab').classList.remove('active');
            const buttons = document.querySelectorAll('.tab-btn');
            buttons[0].classList.remove('active');
            buttons[1].classList.remove('active');

            if (tabName === 'busy') {
                document.getElementById('busyTab').classList.add('active');
                buttons[0].classList.add('active');
            } else {
                document.getElementById('freeTab').classList.add('active');
                buttons[1].classList.add('active');
                updateFreeTimeSummary();
            }
        }

        function parseTimeToMinutes(hStr, mStr) {
            let h = parseInt(hStr, 10);
            let m = mStr ? parseInt(mStr, 10) : 0;
            return h * 60 + m;
        }

        function formatMinutesToTime(totalMinutes) {
            let h = Math.floor(totalMinutes / 60);
            let m = totalMinutes % 60;
            if (m === 0) return `${h}h`;
            return `${h}h${m < 10 ? '0' : ''}${m}`;
        }

        function parseBusyString(busyText) {
            let text = busyText.toLowerCase();
            let regex = /(t2|t3|t4|t5|t6|t7|cn)\s*(\d{1,2})(?:[h:](\d{1,2})p?)?\s*-\s*(\d{1,2})(?:[h:](\d{1,2})p?)?/gi;
            let match;
            let results = [];
            
            while ((match = regex.exec(text)) !== null) {
                let day = match[1].toUpperCase();
                let startMin = parseTimeToMinutes(match[2], match[3]);
                let endMin = parseTimeToMinutes(match[4], match[5]);
                
                let dayStartLimit = START_HOUR * 60;
                let dayEndLimit = END_HOUR * 60;

                if (startMin < endMin && startMin >= dayStartLimit && endMin <= dayEndLimit) {
                    results.push({ day, startMin, endMin });
                }
            }
            return results;
        }

        function updateFreeTimeSummary() {
            let activeMembers = membersData.filter(m => m.name.trim() !== "");
            
            if (activeMembers.length === 0) {
                freeSummaryContent.innerHTML = "<div class='result-box'><h3>Chưa có dữ liệu</h3><p>Vui lòng nhập tên của ít nhất 1 thành viên ở Tab 1 nhé!</p></div>";
                return;
            }

            let startTotalMin = START_HOUR * 60;
            let endTotalMin = END_HOUR * 60;

            let schedule = {};
            daysOfWeek.forEach(day => {
                schedule[day] = {};
                for (let t = startTotalMin; t < endTotalMin; t += TIME_STEP) {
                    schedule[day][t] = []; 
                }
            });

            activeMembers.forEach(member => {
                let busySlots = parseBusyString(member.busy);
                let memberName = member.name.trim();
                
                busySlots.forEach(slot => {
                    for (let t = slot.startMin; t < slot.endMin; t += TIME_STEP) {
                        if (schedule[slot.day] && schedule[slot.day][t]) {
                            schedule[slot.day][t].push(memberName);
                        }
                    }
                });
            });

            let groupedResults = [];
            
            daysOfWeek.forEach(day => {
                let currentGroupStart = null;
                let currentMissingStr = null;

                for (let t = startTotalMin; t <= endTotalMin; t += TIME_STEP) {
                    let missingList = (t < endTotalMin) ? schedule[day][t] : ["FORCE_CLOSE"];
                    let missingStr = missingList.sort().join(',');

                    if (currentMissingStr !== missingStr) {
                        if (currentGroupStart !== null) {
                            let missingArr = currentMissingStr ? currentMissingStr.split(',') : [];
                            let duration = t - currentGroupStart;
                            
                            if (duration >= 30) {
                                groupedResults.push({
                                    day: day,
                                    startMin: currentGroupStart,
                                    endMin: t,
                                    missing: missingArr,
                                    missingCount: missingArr.length
                                });
                            }
                        }
                        currentGroupStart = t;
                        currentMissingStr = missingStr;
                    }
                }
            });

            let perfectHTML = "";
            let warningHTML = "";

            daysOfWeek.forEach(day => {
                let perfectToday = groupedResults.filter(r => r.day === day && r.missingCount === 0);
                let warningToday = groupedResults.filter(r => r.day === day && r.missingCount > 0 && r.missingCount <= 3);

                if (perfectToday.length > 0) {
                    perfectHTML += `<div class="day-group"><div class="day-title">${day}</div>`;
                    perfectToday.forEach(r => {
                        perfectHTML += `<div class="time-badge">${formatMinutesToTime(r.startMin)} - ${formatMinutesToTime(r.endMin)}</div>`;
                    });
                    perfectHTML += `</div>`;
                }

                if (warningToday.length > 0) {
                    warningHTML += `<div class="day-group"><div class="day-title">${day}</div>`;
                    warningToday.forEach(r => {
                        warningHTML += `
                            <div class="time-badge">
                                ${formatMinutesToTime(r.startMin)} - ${formatMinutesToTime(r.endMin)}
                                <span class="missing-list">(Vắng: ${r.missing.join(', ')})</span>
                            </div>`;
                    });
                    warningHTML += `</div>`;
                }
            });

            let finalOutput = "";

            if (perfectHTML !== "") {
                finalOutput += `
                    <div class="result-box perfect">
                        <h3>🌟 Giờ Vàng (Cả nhóm 100% rảnh)</h3>
                        <p>Các khung giờ hoàn hảo nhất trong tuần:</p>
                        ${perfectHTML}
                    </div>`;
            } else {
                finalOutput += `
                    <div class="result-box perfect" style="border-color: #b2bec3;">
                        <h3 style="color: #636e72;">🌟 Giờ Vàng</h3>
                        <p>Hiện chưa tìm thấy khung giờ nào trên 30 phút mà tất cả mọi người đều rảnh.</p>
                    </div>`;
            }

            if (warningHTML !== "") {
                finalOutput += `
                    <div class="result-box warning">
                        <h3>⚠️ Giờ Tập Tạm Ổn (Vắng 1-3 người)</h3>
                        <p>Các khung giờ có thể tranh thủ tập (đã ghi chú người vắng):</p>
                        ${warningHTML}
                    </div>`;
            }

            freeSummaryContent.innerHTML = finalOutput;
        }
function updateFreeTimeSummary() {
            let activeMembers = membersData.filter(m => m.name.trim() !== "");
            
            if (activeMembers.length === 0) {
                freeSummaryContent.innerHTML = "<div class='result-box'><h3>Chưa có dữ liệu</h3><p>Vui lòng nhập tên của ít nhất 1 thành viên ở Tab 1 nhé!</p></div>";
                return;
            }

            let startTotalMin = START_HOUR * 60;
            let endTotalMin = END_HOUR * 60;

            let schedule = {};
            let absentAllDay = {}; // Tính năng mới: Bộ lọc lưu những người vắng cả ngày

            daysOfWeek.forEach(day => {
                schedule[day] = {};
                absentAllDay[day] = [];
                for (let t = startTotalMin; t < endTotalMin; t += TIME_STEP) {
                    schedule[day][t] = []; 
                }
            });

            activeMembers.forEach(member => {
                let busySlots = parseBusyString(member.busy);
                let memberName = member.name.trim();
                
                // Bước 1: Tính tổng số phút bận trong từng ngày của thành viên
                let dailyBusyTime = { 'T2': 0, 'T3': 0, 'T4': 0, 'T5': 0, 'T6': 0, 'T7': 0, 'CN': 0 };
                busySlots.forEach(slot => {
                    dailyBusyTime[slot.day] += (slot.endMin - slot.startMin);
                });

                // Bước 2: Nếu bận >= 12 tiếng (720 phút), xếp vào diện "Vắng cả ngày"
                daysOfWeek.forEach(day => {
                    if (dailyBusyTime[day] >= 720) {
                        absentAllDay[day].push(memberName);
                    }
                });

                // Bước 3: Chỉ tính giờ bận lẻ tẻ vào lịch chung nếu KHÔNG thuộc diện vắng cả ngày
                busySlots.forEach(slot => {
                    if (!absentAllDay[slot.day].includes(memberName)) {
                        for (let t = slot.startMin; t < slot.endMin; t += TIME_STEP) {
                            if (schedule[slot.day] && schedule[slot.day][t]) {
                                schedule[slot.day][t].push(memberName);
                            }
                        }
                    }
                });
            });

            let groupedResults = [];
            
            daysOfWeek.forEach(day => {
                let currentGroupStart = null;
                let currentMissingStr = null;

                for (let t = startTotalMin; t <= endTotalMin; t += TIME_STEP) {
                    let missingList = (t < endTotalMin) ? schedule[day][t] : ["FORCE_CLOSE"];
                    let missingStr = missingList.sort().join(',');

                    if (currentMissingStr !== missingStr) {
                        if (currentGroupStart !== null) {
                            let missingArr = currentMissingStr ? currentMissingStr.split(',') : [];
                            let duration = t - currentGroupStart;
                            
                            // Gộp khung giờ nếu kéo dài trên 30 phút
                            if (duration >= 30) {
                                groupedResults.push({
                                    day: day,
                                    startMin: currentGroupStart,
                                    endMin: t,
                                    missing: missingArr,
                                    missingCount: missingArr.length
                                });
                            }
                        }
                        currentGroupStart = t;
                        currentMissingStr = missingStr;
                    }
                }
            });

            let perfectHTML = "";
            let warningHTML = "";

            daysOfWeek.forEach(day => {
                let perfectToday = groupedResults.filter(r => r.day === day && r.missingCount === 0);
                let warningToday = groupedResults.filter(r => r.day === day && r.missingCount > 0 && r.missingCount <= 3);
                
                // Tạo nhãn chú thích nổi bật cho các bạn vắng cả ngày
                let absentNote = absentAllDay[day].length > 0 
                    ? `<span style="font-size: 13px; color: #d63031; font-weight: 500; margin-left: 10px; background: #ffeaa7; padding: 3px 10px; border-radius: 12px;">(Nghỉ cả ngày: ${absentAllDay[day].join(', ')})</span>` 
                    : "";

                if (perfectToday.length > 0) {
                    perfectHTML += `<div class="day-group"><div class="day-title">${day} ${absentNote}</div>`;
                    perfectToday.forEach(r => {
                        perfectHTML += `<div class="time-badge">${formatMinutesToTime(r.startMin)} - ${formatMinutesToTime(r.endMin)}</div>`;
                    });
                    perfectHTML += `</div>`;
                }

                if (warningToday.length > 0) {
                    warningHTML += `<div class="day-group"><div class="day-title">${day} ${absentNote}</div>`;
                    warningToday.forEach(r => {
                        warningHTML += `
                            <div class="time-badge">
                                ${formatMinutesToTime(r.startMin)} - ${formatMinutesToTime(r.endMin)}
                                <span class="missing-list">(Vắng: ${r.missing.join(', ')})</span>
                            </div>`;
                    });
                    warningHTML += `</div>`;
                }
            });

            let finalOutput = "";

            if (perfectHTML !== "") {
                finalOutput += `
                    <div class="result-box perfect">
                        <h3>🌟 Giờ Vàng (Cả nhóm rảnh)</h3>
                        <p>Các khung giờ hoàn hảo nhất (đã tự động tính toán lại, không bao gồm các bạn nghỉ cả ngày):</p>
                        ${perfectHTML}
                    </div>`;
            } else {
                finalOutput += `
                    <div class="result-box perfect" style="border-color: #b2bec3;">
                        <h3 style="color: #636e72;">🌟 Giờ Vàng</h3>
                        <p>Hiện chưa tìm thấy khung giờ nào trên 30 phút mà tất cả mọi người (trừ người nghỉ cả ngày) đều rảnh.</p>
                    </div>`;
            }

            if (warningHTML !== "") {
                finalOutput += `
                    <div class="result-box warning">
                        <h3>⚠️ Giờ Tập Tạm Ổn (Vắng 1-3 người)</h3>
                        <p>Các khung giờ có thể tranh thủ tập (đã ghi chú người vắng):</p>
                        ${warningHTML}
                    </div>`;
            }

            freeSummaryContent.innerHTML = finalOutput;
        }
        loadFromCloud();
    </script>
