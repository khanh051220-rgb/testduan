<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thống Kê Lịch Tập 20/11 - Chia Mục Rảnh/Bận</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe, #74b9ff);
            margin: 0;
            padding: 20px;
            color: #2d3436;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            max-width: 950px;
            margin: 0 auto;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }
        h1 {
            text-align: center;
            color: #6c5ce7;
            margin-bottom: 5px;
            font-weight: 600;
        }
        p.subtitle {
            text-align: center;
            color: #636e72;
            margin-bottom: 30px;
        }
        
        /* Thanh chuyển đổi 2 mục (Tabs) */
        .tab-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }
        .tab-btn {
            background-color: #f1f2f6;
            color: #2d3436;
            border: 2px solid #dfe6e9;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .tab-btn.active {
            background-color: #6c5ce7;
            color: white;
            border-color: #6c5ce7;
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.4);
        }

        /* Nội dung của từng mục */
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        .table-responsive {
            overflow-x: auto;
            max-height: 480px;
            border: 1px solid #dfe6e9;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 14px 16px;
            text-align: center;
            border-bottom: 1px solid #dfe6e9;
        }
        th {
            background: linear-gradient(135deg, #6c5ce7, #8e44ad);
            color: white;
            position: sticky;
            top: 0;
            z-index: 1;
            font-weight: 600;
        }
        tbody tr:nth-child(even) {
            background-color: #f9f9fb;
        }
        tbody tr:hover {
            background-color: #f1f2f6;
        }

        input.table-input {
            width: 90%;
            padding: 10px;
            border: 1px solid #b2bec3;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            transition: border-color 0.2s;
        }
        input.table-input:focus {
            border-color: #6c5ce7;
            outline: none;
            box-shadow: 0 0 5px rgba(108, 92, 231, 0.3);
        }

        /* Khung hiển thị giờ rảnh */
        .free-summary-box {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 12px;
            border-left: 6px solid #00b894;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
        .free-summary-box h3 {
            color: #00b894;
            margin-top: 0;
        }
        ul {
            padding-left: 20px;
            line-height: 1.8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Lịch Tập Văn Nghệ 20/11</h1>
        <p class="subtitle">Bảng thống kê tên, giờ bận và tự động tổng hợp giờ rảnh của 31 thành viên</p>

        <!-- Các nút bấm chuyển mục -->
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('busy')">1. Nhập Tên & Thời Gian Bận</button>
            <button class="tab-btn" onclick="switchTab('free')">2. Thời Gian Rảnh (Tổng Hợp)</button>
        </div>

        <!-- MỤC 1: NHẬP TÊN VÀ THỜI GIAN BẬN -->
        <div id="busyTab" class="tab-content active">
            <p style="text-align: center; color: #636e72; margin-bottom: 20px;">Mời các bạn điền họ tên và thời gian bận vào bảng dưới đây:</p>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>STT</th>
                            <th>Họ và Tên</th>
                            <th>Thời Gian Bận</th>
                        </tr>
                    </thead>
                    <tbody id="busyTableBody">
                        <!-- JavaScript tự động sinh ra 31 dòng trống -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- MỤC 2: XEM THỜI GIAN RẢNH -->
        <div id="freeTab" class="tab-content">
            <div class="free-summary-box">
                <h3>Tổng Hợp Lịch Rảnh Của Cả Nhóm</h3>
                <div id="freeSummaryContent">Đang tổng hợp...</div>
            </div>
        </div>

    </div>

    <script>
        // Tạo sẵn mảng gồm 31 phần tử trống để cậu hoặc các bạn tự điền tên và giờ bận
        const membersData = Array.from({ length: 31 }, () => ({ name: "", busy: "" }));

        const busyTableBody = document.getElementById('busyTableBody');
        const freeSummaryContent = document.getElementById('freeSummaryContent');

        // Khởi tạo bảng danh sách trống cho 31 người
        function initApp() {
            busyTableBody.innerHTML = "";
            membersData.forEach((member, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td><input type="text" class="table-input" placeholder="Nhập tên bạn số ${index + 1}" value="${member.name}" oninput="updateName(${index}, this.value)"></td>
                    <td><input type="text" class="table-input" placeholder="Ví dụ: Bận sáng T2..." value="${member.busy}" oninput="updateBusy(${index}, this.value)"></td>
                `;
                busyTableBody.appendChild(row);
            });
            updateFreeTimeSummary();
        }

        // Cập nhật tên khi gõ
        function updateName(index, value) {
            membersData[index].name = value;
            updateFreeTimeSummary();
        }

        // Cập nhật giờ bận khi gõ
        function updateBusy(index, value) {
            membersData[index].busy = value;
            updateFreeTimeSummary();
        }

        // Chuyển đổi qua lại giữa 2 Tab
        function switchTab(tabName) {
            const busyTab = document.getElementById('busyTab');
            const freeTab = document.getElementById('freeTab');
            const buttons = document.querySelectorAll('.tab-btn');

            buttons.forEach(btn => btn.classList.remove('active'));

            if (tabName === 'busy') {
                busyTab.classList.add('active');
                freeTab.classList.remove('active');
                buttons[0].classList.add('active');
            } else {
                busyTab.classList.remove('active');
                freeTab.classList.add('active');
                buttons[1].classList.add('active');
                updateFreeTimeSummary();
            }
        }

        // Tự động tính toán và hiển thị giờ rảnh tổng hợp
        function updateFreeTimeSummary() {
            let summaryHTML = "<ul>";
            let activeCount = 0;

            membersData.forEach((member, index) => {
                const trimmedName = member.name.trim();
                const trimmedBusy = member.busy.trim();
                const displayName = trimmedName !== "" ? trimmedName : `Thành viên số ${index + 1}`;

                if (trimmedName !== "" || trimmedBusy !== "") {
                    activeCount++;
                    if (trimmedBusy !== "") {
                        summaryHTML += `<li><b>${displayName}</b>: Bận [<span style="color: #d63031; font-weight: 500;">${trimmedBusy}</span>] $\rightarrow$ <span style="color: #00b894; font-weight: 600;">Rảnh các thời gian còn lại</span></li>`;
                    } else {
                        summaryHTML += `<li><b>${displayName}</b>: <span style="color: #00b894; font-weight: 600;">Chưa báo bận (Rảnh cả ngày)</span></li>`;
                    }
                }
            });

            summaryHTML += "</ul>";
            if (activeCount === 0) {
                summaryHTML = "<p style='color: #636e72;'>Chưa có thông tin tên hoặc giờ bận nào được nhập. Các bạn hãy điền vào bảng ở mục 1 nhé!</p>";
            }
            freeSummaryContent.innerHTML = summaryHTML;
        }

        // Chạy khởi tạo khi vừa mở trang
        initApp();
    </script>

</body>
</html>
