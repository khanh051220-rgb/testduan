<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thống Kê Lịch Tập 20/11 - Tự Động Hóa</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe, #74b9ff);
            margin: 0;
            padding: 20px;
            color: #2d3436;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            max-width: 950px;
            margin: 0 auto;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }
        h1 {
            text-align: center;
            color: #6c5ce7;
            margin-bottom: 5px;
            font-weight: 600;
        }
        p.subtitle {
            text-align: center;
            color: #636e72;
            margin-bottom: 30px;
        }
        
        .tab-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }
        .tab-btn {
            background-color: #f1f2f6;
            color: #2d3436;
            border: 2px solid #dfe6e9;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .tab-btn.active {
            background-color: #6c5ce7;
            color: white;
            border-color: #6c5ce7;
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.4);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .table-responsive {
            overflow-x: auto;
            max-height: 480px;
            border: 1px solid #dfe6e9;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 14px 16px;
            text-align: center;
            border-bottom: 1px solid #dfe6e9;
        }
        th {
            background: linear-gradient(135deg, #6c5ce7, #8e44ad);
            color: white;
            position: sticky;
            top: 0;
            z-index: 1;
            font-weight: 600;
        }
        tbody tr:nth-child(even) { background-color: #f9f9fb; }
        tbody tr:hover { background-color: #f1f2f6; }

        input.table-input {
            width: 90%;
            padding: 10px;
            border: 1px solid #b2bec3;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            transition: border-color 0.2s;
        }
        input.table-input:focus {
            border-color: #6c5ce7;
            outline: none;
            box-shadow: 0 0 5px rgba(108, 92, 231, 0.3);
        }

        /* Styling cho Tab Tổng Hợp */
        .result-box {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
        .result-box.perfect { border-left: 6px solid #00b894; }
        .result-box.warning { border-left: 6px solid #fdcb6e; }
        .result-box.bad { border-left: 6px solid #d63031; }
        
        .result-box h3 { margin-top: 0; display: flex; align-items: center; gap: 10px; }
        .perfect h3 { color: #00b894; }
        .warning h3 { color: #e1b12c; }
        
        .time-badge {
            display: inline-block;
            background: #dfe6e9;
            padding: 8px 15px;
            border-radius: 20px;
            margin: 5px;
            font-weight: 600;
            color: #2d3436;
        }
        .perfect .time-badge { background: #55efc4; color: #006266; }
        .warning .time-badge { background: #ffeaa7; color: #d35400; }
        
        .missing-list {
            font-size: 14px;
            color: #636e72;
            margin-top: 5px;
            font-weight: normal;
        }
        .instruction {
            background: #e9ecef;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            color: #2d3436;
            margin-bottom: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Lịch Tập Văn Nghệ 20/11</h1>
        <p class="subtitle">Tìm nhanh "Giờ Vàng" để cả đội cùng tập luyện</p>

        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('busy')">1. Nhập Thời Gian Bận</button>
            <button class="tab-btn" onclick="switchTab('free')">2. Giờ Rảnh Chung (Tự động)</button>
        </div>

        <!-- MỤC 1: NHẬP TÊN VÀ THỜI GIAN BẬN -->
        <div id="busyTab" class="tab-content active">
            <div class="instruction">
                <b>💡 Gợi ý nhập liệu:</b> Để máy tính tính toán chính xác, hãy nhập ca bận theo cú pháp: 
                <span style="color:#d63031; font-weight:bold;">Sáng T2, Chiều T5, Tối CN</span>... (ngăn cách bằng dấu phẩy).
            </div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>STT</th>
                            <th>Họ và Tên</th>
                            <th>Thời Gian Bận</th>
                        </tr>
                    </thead>
                    <tbody id="busyTableBody">
                        <!-- JS tạo 31 dòng -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- MỤC 2: XEM THỜI GIAN RẢNH TỰ ĐỘNG -->
        <div id="freeTab" class="tab-content">
            <div id="freeSummaryContent">
                <!-- Sẽ tự động đổ dữ liệu vào đây -->
            </div>
        </div>
    </div>

    <script>
        const membersData = Array.from({ length: 31 }, () => ({ name: "", busy: "" }));
        
        // Tạo ra 21 khung giờ chuẩn (Sáng, Chiều, Tối từ T2 đến CN)
        const days = ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'];
        const shifts = ['Sáng', 'Chiều', 'Tối'];
        const allTimeSlots = [];
        days.forEach(day => {
            shifts.forEach(shift => {
                allTimeSlots.push(`${shift} ${day}`);
            });
        });

        const busyTableBody = document.getElementById('busyTableBody');
        const freeSummaryContent = document.getElementById('freeSummaryContent');

        function initApp() {
            busyTableBody.innerHTML = "";
            membersData.forEach((member, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td><input type="text" class="table-input" placeholder="Tên thành viên ${index + 1}" oninput="updateName(${index}, this.value)"></td>
                    <td><input type="text" class="table-input" placeholder="VD: Sáng T2, Chiều T6" oninput="updateBusy(${index}, this.value)"></td>
                `;
                busyTableBody.appendChild(row);
            });
            updateFreeTimeSummary();
        }

        function updateName(index, value) {
            membersData[index].name = value;
            updateFreeTimeSummary();
        }

        function updateBusy(index, value) {
            membersData[index].busy = value;
            updateFreeTimeSummary();
        }

        function switchTab(tabName) {
            document.getElementById('busyTab').classList.remove('active');
            document.getElementById('freeTab').classList.remove('active');
            const buttons = document.querySelectorAll('.tab-btn');
            buttons[0].classList.remove('active');
            buttons[1].classList.remove('active');

            if (tabName === 'busy') {
                document.getElementById('busyTab').classList.add('active');
                buttons[0].classList.add('active');
            } else {
                document.getElementById('freeTab').classList.add('active');
                buttons[1].classList.add('active');
                updateFreeTimeSummary();
            }
        }

        // Hàm xóa dấu tiếng Việt giúp máy tính tìm chữ chính xác hơn (ví dụ: sang t2 = Sáng T2)
        function removeAccents(str) {
            return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
        }

        function updateFreeTimeSummary() {
            let activeMembers = membersData.filter(m => m.name.trim() !== "");
            
            if (activeMembers.length === 0) {
                freeSummaryContent.innerHTML = "<div class='result-box'><h3>Chưa có dữ liệu</h3><p>Vui lòng nhập tên của ít nhất 1 thành viên ở Tab 1 nhé!</p></div>";
                return;
            }

            // Tạo biến lưu trữ xem ca nào có ai bận
            const scheduleData = {};
            allTimeSlots.forEach(slot => scheduleData[slot] = []);

            // Quét dữ liệu bận của từng người
            activeMembers.forEach(member => {
                const normalizedBusyText = removeAccents(member.busy);
                allTimeSlots.forEach(slot => {
                    const normalizedSlot = removeAccents(slot);
                    // Nếu văn bản bận của người đó có chứa tên ca tập (ví dụ "sang t2")
                    if (normalizedBusyText.includes(normalizedSlot)) {
                        scheduleData[slot].push(member.name.trim());
                    }
                });
            });

            // Phân loại kết quả
            let perfectHTML = ""; // Nhóm rảnh 100%
            let warningHTML = ""; // Nhóm vắng 1-3 người

            allTimeSlots.forEach(slot => {
                const missingPeople = scheduleData[slot];
                
                if (missingPeople.length === 0) {
                    perfectHTML += `<div class="time-badge">${slot}</div>`;
                } else if (missingPeople.length > 0 && missingPeople.length <= 3) {
                    warningHTML += `
                        <div class="time-badge">
                            ${slot} 
                            <div class="missing-list">(Vắng: ${missingPeople.join(', ')})</div>
                        </div>`;
                }
            });

            // Xuất ra màn hình
            let finalOutput = "";

            if (perfectHTML !== "") {
                finalOutput += `
                    <div class="result-box perfect">
                        <h3>🌟 Giờ Vàng (Cả nhóm 100% rảnh)</h3>
                        <p>Tuyệt vời! Hãy chọn những ca này để tập full đội hình:</p>
                        <div>${perfectHTML}</div>
                    </div>
                `;
            } else {
                finalOutput += `
                    <div class="result-box perfect" style="border-color: #b2bec3;">
                        <h3 style="color: #636e72;">🌟 Giờ Vàng (Cả nhóm 100% rảnh)</h3>
                        <p>Hiện tại chưa tìm thấy khung giờ nào tất cả mọi người đều rảnh.</p>
                    </div>
                `;
            }

            if (warningHTML !== "") {
                finalOutput += `
                    <div class="result-box warning">
                        <h3>⚠️ Giờ Tập Tạm Ổn (Vắng từ 1-3 người)</h3>
                        <p>Nếu không có Giờ Vàng, có thể cân nhắc các ca sau (máy tính đã note rõ ai vắng mặt):</p>
                        <div>${warningHTML}</div>
                    </div>
                `;
            }

            freeSummaryContent.innerHTML = finalOutput;
        }

        initApp();
    </script>
</body>
</html>
